# =====================================================================================
#  Shared configuration. Read on every run, whatever the layer.
# =====================================================================================
#  Everything here is a DEFAULT, and nothing here has to be edited to change a run.
#
#  Override order (highest wins):
#     -Dkey=value  >  config/<platform>.properties  >  this file
#
#  So a different target, device or timeout is a flag, not a file edit:
#     mvn test -Papi    -Dapi.base.uri=https://api.zippopotam.us
#     mvn test -Pmobile -Ddevice.name=Pixel_7 -Dplatform=android
#
#  Never commit a real credential here.
# =====================================================================================

# ---------- API ----------
api.base.uri=https://api.zippopotam.us

# ---------- Mobile ----------
# Selects which config/<platform>.properties is layered on top of this file.
platform=android

appium.server.url=http://127.0.0.1:4723
# Start an Appium server automatically when none is already listening on the URL above, and
# stop it when the run ends. An already-running server is detected and reused, so running
# `appium` yourself still works. Set false to always manage the server yourself.
appium.auto.start=true
# Seconds to wait for a self-started server to begin listening. The Java client defaults to 20,
# which a cold Appium 3 start can exceed - measured at 22s on this machine, and slower on the
# very first run because it builds its cache directory.
appium.server.startup.timeout=90
# Seconds Appium waits for the next command before ending the session on its own.
appium.new.command.timeout=120
# How long UiAutomator may wait for the screen to settle before answering a query.
# Low enough that a snackbar is still observable, high enough that a tap is not swallowed
# by a dialog's entry animation. Raise it on a slow device.
appium.wait.for.idle.millis=400

# Base device-side helper port. Each session adds its own offset, so parallel
# sessions on one host never collide.
appium.system.port=8200

# ---------- Waits (seconds) ----------
# One window for every explicit wait in the framework.
timeout.explicit=20

# ---------- Reporting ----------
screenshot.on.failure=true

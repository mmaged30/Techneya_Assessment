# =====================================================================================
#  BrowserStack capabilities. Layered on top of global.properties AND the platform file
#  when execution.target=browserstack, so the values here win over local defaults while
#  a -D flag still beats everything.
# =====================================================================================
#  NEVER put the username or access key in this file - it is committed. They are read
#  from the environment:
#
#      export BROWSERSTACK_USERNAME=...
#      export BROWSERSTACK_ACCESS_KEY=...
#
#  UNVERIFIED: no run has ever been executed against BrowserStack from this project.
#  The wiring is real; the device names below are defaults, not confirmed selections.
# =====================================================================================

browserstack.hub.url=https://hub-cloud.browserstack.com/wd/hub

# --- Device under test (override per run with -Ddevice.name / -Ddevice.platform.version) ---
device.name=Google Pixel 7
device.platform.version=13.0

# --- Dashboard grouping ---
browserstack.project.name=Zippopotam + Wikipedia
browserstack.build.name=local-build

# --- The app under test ---
# The bs:// id returned by BrowserStack's upload API. Left blank so a misconfigured run
# fails on a missing app rather than silently driving whatever was uploaded last.
browserstack.app=

# --- Diagnostics. Both slow a session down, so both are off by default. ---
browserstack.debug=false
browserstack.network.logs=false

# =====================================================================================
#  Android capabilities. Layered on top of global.properties when platform=android.
# =====================================================================================
#  The app is NOT shipped with this repository - install Wikipedia from the Play Store
#  (or `adb install`) before running the mobile suite. See the README.
# =====================================================================================

# Free text unless you are targeting one of several attached devices, in which case
# it must match `adb devices`. Override per machine:  -Ddevice.name=Pixel_7_API_34
device.name=Android Emulator

# Left blank on purpose: with a single device attached, Appium binds to whatever is
# there. Set it only when several devices on different OS versions are connected.
device.platform.version=

# --- Application under test ---
app.package=org.wikipedia
app.activity=org.wikipedia.main.MainActivity

# Optional classpath path to an .apk, e.g. apps/wikipedia.apk. Left blank because the
# app is installed from the store; an APK is not committed to the repository.
app.path=

# --- Reset behaviour ---
# Reading-list scenarios mutate persistent app state, so each scenario has to start
# from a known one. no.reset=false lets Appium clear the app's data between sessions,
# which is what stops a list created by one scenario leaking into the next.
app.no.reset=false
# Uninstall and reinstall between sessions. Far slower, and pointless when the data
# clear above already isolates scenarios.
app.full.reset=false
